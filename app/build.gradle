plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// 读取 keystore 配置（支持 keystore/keystore.properties 或环境变量）；未配置时返回 null，跳过签名配置
static def loadReleaseSigningInfo(Project project) {
    def keystorePropertiesFile = project.rootProject.file("keystore/keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def keystoreFilePath = System.getenv("RELEASE_STORE_FILE") ?: keystoreProperties.getProperty('storeFile')
    def keystorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProperties.getProperty('storePassword')
    def keyAliasName = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProperties.getProperty('keyAlias')
    def keyPasswordValue = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProperties.getProperty('keyPassword')
    def keystoreFile = keystoreFilePath ? project.rootProject.file(keystoreFilePath) : null
    if (keystoreFile != null && keystoreFile.exists() && keystorePassword && keyAliasName && keyPasswordValue) {
        return [file: keystoreFile, password: keystorePassword, alias: keyAliasName, keyPassword: keyPasswordValue]
    }
    return null
}

android {
    compileSdk 36
    namespace 'com.yuyan'
    defaultConfig {
        applicationId "com.yuyan.pinyin"
        minSdk 23
        targetSdk 36
        versionCode Integer.valueOf(versionCodeDate())
        versionName versionNameDate()

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }

        lintOptions {
            abortOnError false
        }
    }
    
    packagingOptions {
        jniLibs {
            // 不 extractNativeLibs：.so 未压缩直接存入 APK（对齐），安装后 mmap 加载，无需解压到私有目录
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            def ks = loadReleaseSigningInfo(project)
            if (ks != null) {
                storeFile ks.file
                storePassword ks.password
                keyAlias ks.alias
                keyPassword ks.keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    //多渠道打包
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension "default"
            applicationIdSuffix  ".offline"
        }
    }

    buildTypes {
        release {
            // 混淆
            minifyEnabled true
            shrinkResources true
            applicationIdSuffix  ".release"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            // 未配置 keystore 时不启用 release 签名（否则 AGP 会因空签名配置报错）
            if (loadReleaseSigningInfo(project) != null) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix ".debug"
            // 没有配置 keystore 时，debug 构建回退到默认 debug 签名，避免签名配置为空导致打包失败
            if (loadReleaseSigningInfo(project) != null) {
                signingConfig signingConfigs.release
            }
        }

    }
    //    第三方库使用java1.8
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "yuyanIme_${versionCodeDate()}_${variant.buildType.name}.apk"
        }
    }
}

static def versionCodeDate() {
    return new Date().format("yyyyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

static def versionNameDate() {
    return new Date().format("yyyyMMdd.HH", TimeZone.getTimeZone("GMT+8"))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':yuyansdk')
}
